name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME is set),
      # and Gradle installs any missing SDK packages itself, so no setup-android step is needed.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: claude-run-apk
          path: app/build/outputs/apk/debug/app-debug.apk
